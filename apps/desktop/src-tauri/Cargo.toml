[package]
name = "lightguard"
version = "0.15.6"
description = "LightGuard - lightweight SSH server guard"
authors = ["LightGuard"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lightguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.65.0", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util", "fs"] }
base64 = "0.22"
aes-gcm = "0.10"
thiserror = "2"
keyring = "4.2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
russh-sftp = "3.0.1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
encoding_rs = "0.8"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
# 与 tauri-plugin-updater 保持一致：单 crypto provider（ring），避免 CMake/NASM 构建。
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
