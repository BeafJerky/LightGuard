[package]
name = "lightguard"
version = "0.10.0"
description = "LightGuard - lightweight SSH server guard"
authors = ["LightGuard"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lightguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.65.0", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
base64 = "0.22"
aes-gcm = "0.10"
thiserror = "2"
keyring = "4.2.0"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
